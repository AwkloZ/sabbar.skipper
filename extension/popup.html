<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Sabbar Skipper</h1>
  <label class="row">
    <span>Show direct apply links</span>
    <input type="checkbox" id="finder">
  </label>
  <p class="hint">Finds the company / job-board link behind Sabbar's Apply button and shows it at the bottom-left of job pages.</p>
  <hr>
  <label class="row">
    <span>Pretend to be a phone</span>
    <input type="checkbox" id="phoneMode">
  </label>
  <label class="row">
    <span>Phone type</span>
    <select id="device">
      <option value="android">Android</option>
      <option value="iphone">iPhone</option>
    </select>
  </label>
  <button id="phoneWindow">Open Sabbar in a phone-sized window</button>
  <p class="hint">Changes reload any open Sabbar tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
